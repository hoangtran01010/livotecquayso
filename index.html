<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVOTEC - LUCKY DRAW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-teal: #006b6b;
            --accent-yellow: #ffeb3b;
            --prize-orange: linear-gradient(to bottom, #f59e0b, #d97706);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: url('https://karofi.karofi.com/karofi-com/2026/03/backgroun-quay-so.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 45, 45, 0.45);
            z-index: 0;
        }

        header, main, footer {
            position: relative;
            z-index: 10;
        }

        .slot-box {
            width: 65px;
            height: 90px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 900;
            color: #004d4d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3), inset 0 0 10px rgba(0,0,0,0.1);
            margin: 0 3px;
            position: relative;
            overflow: hidden;
        }

        .slot-digit {
            display: inline-block;
            height: 100%;
            line-height: 90px;
            text-align: center;
        }

        .btn-spin {
            background: #facc15;
            color: #004d4d;
            padding: 12px 50px;
            font-size: 1.25rem;
            font-weight: 900;
            border-radius: 50px;
            box-shadow: 0 6px 0 #ca8a04, 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.1s;
            text-transform: uppercase;
        }

        .btn-spin:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #ca8a04, 0 6px 10px rgba(0,0,0,0.3);
        }

        .btn-spin:disabled {
            background: #9ca3af;
            box-shadow: 0 6px 0 #4b5563;
            color: #f3f4f6;
            cursor: not-allowed;
            transform: none;
        }

        .prize-banner {
            background: var(--prize-orange);
            padding: 6px 35px;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-size: 0.9rem;
        }

        #winner-overlay, #history-overlay {
            background: rgba(0, 0, 0, 0.9);
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .winner-card, .history-card {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 900px;
            width: 95%;
            border: 8px solid #facc15;
            max-height: 80vh;
            overflow-y: auto;
        }

        select {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
        }
        
        select option {
            background: #004d4d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #006b6b;
            color: white;
        }

        tr:nth-child(even) { background-color: #f9f9f9; }

        #audio-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 50;
        }
    </style>
</head>
<body>
    <!-- UI Header -->
    <header class="p-6 flex items-center z-20">
        <div class="flex-1"></div>

        <!-- Center Logo - New URL & Smaller size -->
        <div class="flex-1 flex justify-center">
            <img src="https://karofi.karofi.com/karofi-com/2026/06/logo-karofi-300px.png" alt="Livotec Logo" class="h-14 w-auto object-contain">
        </div>
        
        <!-- Controls Right -->
        <div class="flex-1 flex items-center justify-end gap-5">
            <div class="flex flex-col">
                <label class="text-[9px] uppercase opacity-70 mb-1 font-bold">Giải thưởng</label>
                <select id="prize-select" onchange="updatePrizeUI()">
                    <option value="Giải Đặc Biệt">Giải Đặc Biệt</option>
                    <option value="Giải Nhất">Giải Nhất</option>
                    <option value="Giải Nhì">Giải Nhì</option>
                    <option value="Giải Ba">Giải Ba</option>
                    <option value="Giải May Mắn" selected>Giải May Mắn</option>
                </select>
            </div>
            <div class="flex flex-col items-center">
                <label class="text-[9px] uppercase opacity-70 mb-1 font-bold">Số lượng</label>
                <div id="prize-remaining-badge" class="bg-white/20 border border-white/30 text-white text-lg px-3 py-1 rounded-lg font-black min-w-[55px] text-center">
                    0/6
                </div>
            </div>
            <button onclick="toggleHistory()" class="bg-white/10 hover:bg-white/20 p-2.5 rounded-full transition" title="Lịch sử trúng giải">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center relative z-10 px-4 mt-4">
        <h3 class="text-5xl font-black mb-2 tracking-widest text-yellow-400 drop-shadow-lg">LUCKY DRAW</h3>
        <h4 class="text-lg font-bold mb-8 opacity-90 tracking-widest uppercase text-center">HỢP TÁC BỀN CHẶT - THÀNH CÔNG VƯỢT TRỘI</h4>

        <div class="prize-banner mb-5 flex items-center gap-4">
            <span id="prize-display-name">GIẢI MAY MẮN</span>
        </div>
        <div class="text-xl font-bold mb-10 text-yellow-200" id="prize-item-detail">06 QUẠT CÂY LIVOTEC S-100</div>

        <!-- Slot Machine -->
        <div id="slots-wrapper" class="flex flex-wrap justify-center gap-1 mb-10">
            <!-- 12 slots -->
        </div>

        <!-- Spin Controls -->
        <div class="flex flex-col items-center gap-3">
            <button id="spin-btn" class="btn-spin" onclick="handleSpin()">QUAY SỐ</button>
            <p id="hint-msg" class="text-[10px] opacity-70 uppercase tracking-widest font-black">NHẤN SPACE ĐỂ QUAY</p>
        </div>
    </main>

    <div id="audio-toggle" onclick="toggleAudio()">
        <svg id="audio-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    </div>

    <footer class="p-4 flex justify-between items-center text-[9px] opacity-40 z-10 font-bold uppercase tracking-widest">
        <div>Tổng cộng: <span id="player-count">0</span> khách hàng</div>
        <div id="status-msg">Sẵn sàng</div>
        <div>LIVOTEC 2026</div>
    </footer>

    <!-- Winner Overlay & History Overlay (remains same logic) -->
    <div id="winner-overlay">
        <div class="winner-card shadow-2xl">
            <h4 class="text-xl font-bold mb-2 text-gray-500 uppercase">CHÚC MỪNG QUÝ KHÁCH</h4>
            <div id="winner-name" class="text-4xl font-black mb-4 text-red-600 uppercase tracking-tight">---</div>
            <p class="text-sm">Có mã số trúng thưởng</p>
            <div id="winner-code" class="text-3xl font-black my-4 bg-teal-800 text-white py-2.5 px-7 inline-block rounded-xl tracking-[0.2em] shadow-lg">
                ---
            </div>
            <p class="text-lg font-bold text-teal-700 mt-2" id="winner-prize-name">---</p>
            <button class="mt-8 px-10 py-3 bg-teal-700 text-white rounded-full font-bold uppercase hover:bg-teal-900 transition shadow-xl" onclick="closeWinner()">Đóng và Tiếp tục</button>
        </div>
    </div>

    <div id="history-overlay">
        <div class="history-card">
            <div class="flex justify-between items-center mb-6">
                <h4 class="text-xl font-black text-teal-800 uppercase">Danh sách trúng giải</h4>
                <div class="flex gap-2">
                    <button onclick="exportCSV()" class="bg-green-600 text-white px-3 py-1.5 rounded font-bold text-xs">Xuất CSV</button>
                    <button onclick="toggleHistory()" class="bg-gray-200 text-gray-800 px-3 py-1.5 rounded font-bold text-xs">Đóng</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table id="history-table">
                    <thead>
                        <tr>
                            <th>Thời gian</th>
                            <th>Giải thưởng</th>
                            <th>Họ và Tên</th>
                            <th>Mã số</th>
                            <th>SĐT</th>
                            <th>Xóa</th>
                        </tr>
                    </thead>
                    <tbody id="history-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Logic remains identical to previous version, just updated UI parameters
        const SHEET_ID = '1tynSospHDasESPytLBCU90X_2Zuyq5TnG41KY60FVxw';
        const SHEET_SOURCE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0`;
        
        const PRIZES = {
            "Giải Đặc Biệt": { count: 1, item: "Điều hòa một chiều Livotec DH12 Inverter" },
            "Giải Nhất": { count: 2, item: "Điều hòa một chiều Livotec DH9 Inverter" },
            "Giải Nhì": { count: 3, item: "Bình nước nóng gián tiếp Livotec LWH-I30A25" },
            "Giải Ba": { count: 5, item: "Nồi cơm điện tử Livotec LRC-E8218" },
            "Giải May Mắn": { count: 6, item: "Quạt cây Livotec S-100" }
        };

        const sounds = {
            click: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
            spin: new Audio('https://assets.mixkit.co/active_storage/sfx/2042/2042-preview.mp3'),
            win: new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3'),
            tick: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3')
        };
        sounds.spin.loop = true;
        sounds.tick.volume = 0.3;

        let isMuted = false;
        let players = [];
        let isSpinning = false;
        let winners = JSON.parse(localStorage.getItem('livotec_winners') || '[]');
        let currentWinner = null;
        let slotIntervals = [];

        function toggleAudio() {
            isMuted = !isMuted;
            const icon = document.getElementById('audio-icon');
            if (isMuted) {
                icon.innerHTML = '<line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9l-5 5H2v-4h2l5-5v10z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
                Object.values(sounds).forEach(s => s.muted = true);
            } else {
                icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
                Object.values(sounds).forEach(s => s.muted = false);
            }
        }

        function playSound(name) {
            if (isMuted) return;
            const s = sounds[name];
            if (s) { s.currentTime = 0; s.play().catch(() => {}); }
        }

        function createSlots() {
            const wrapper = document.getElementById('slots-wrapper');
            wrapper.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                const box = document.createElement('div');
                box.className = 'slot-box';
                box.innerHTML = `<span id="digit-${i}" class="slot-digit">0</span>`;
                wrapper.appendChild(box);
            }
        }

        async function loadPlayers() {
            document.getElementById('status-msg').innerText = "Đang tải...";
            try {
                const response = await fetch(SHEET_SOURCE_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                players = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return {
                        stt: cols[0]?.replace(/"/g, '').trim(),
                        name: cols[1]?.replace(/"/g, '').trim(),
                        code: cols[2]?.replace(/"/g, '').trim(),
                        phone: cols[3]?.replace(/"/g, '').trim()
                    };
                }).filter(p => p.code && p.name);
                document.getElementById('player-count').innerText = players.length;
                document.getElementById('status-msg').innerText = "Sẵn sàng";
                updatePrizeUI();
            } catch (error) {
                document.getElementById('status-msg').innerText = "Lỗi Sheet!";
            }
        }

        function updatePrizeUI() {
            playSound('click');
            const prizeKey = document.getElementById('prize-select').value;
            const detail = PRIZES[prizeKey];
            const currentWinCount = winners.filter(w => w.prize === prizeKey).length;
            const isFull = currentWinCount >= detail.count;

            document.getElementById('prize-display-name').innerText = prizeKey;
            document.getElementById('prize-item-detail').innerText = `${detail.count.toString().padStart(2, '0')} ${detail.item}`;
            
            const badge = document.getElementById('prize-remaining-badge');
            badge.innerText = `${currentWinCount}/${detail.count}`;
            
            const spinBtn = document.getElementById('spin-btn');
            const hintMsg = document.getElementById('hint-msg');
            
            if (isFull) {
                spinBtn.disabled = true;
                spinBtn.innerText = "HẾT GIẢI";
                hintMsg.innerText = "Đã đủ số lượng trúng giải";
                hintMsg.classList.add('text-red-400');
                badge.classList.add('bg-red-500', 'border-red-400');
                badge.classList.remove('bg-white/20');
            } else {
                spinBtn.disabled = false;
                spinBtn.innerText = "QUAY SỐ";
                hintMsg.innerText = "NHẤN SPACE ĐỂ QUAY";
                hintMsg.classList.remove('text-red-400');
                badge.classList.remove('bg-red-500', 'border-red-400');
                badge.classList.add('bg-white/20');
            }
        }

        function handleSpin() {
            if (isSpinning) return;
            const prizeKey = document.getElementById('prize-select').value;
            const availablePlayers = players.filter(p => !winners.some(w => w.code === p.code));
            if (availablePlayers.length === 0) { alert("Hết khách hàng hợp lệ!"); return; }
            playSound('click');
            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('spin-btn').innerText = "ĐANG QUAY...";
            currentWinner = availablePlayers[Math.floor(Math.random() * availablePlayers.length)];
            startAnimation();
            setTimeout(() => stopAnimation(currentWinner.code), 3500);
        }

        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        function startAnimation() {
            slotIntervals.forEach(clearInterval);
            slotIntervals = [];
            playSound('spin');
            for (let i = 0; i < 12; i++) {
                const interval = setInterval(() => {
                    document.getElementById(`digit-${i}`).innerText = chars[Math.floor(Math.random() * chars.length)];
                    if (i === 0) playSound('tick');
                }, 40 + (i * 15));
                slotIntervals.push(interval);
            }
        }

        function stopAnimation(targetCode) {
            let displayCode = targetCode.toString().toUpperCase().padEnd(12, ' ').slice(0, 12);
            slotIntervals.forEach((interval, i) => {
                setTimeout(() => {
                    clearInterval(interval);
                    document.getElementById(`digit-${i}`).innerText = displayCode[i];
                    playSound('tick');
                    if (i === 11) { sounds.spin.pause(); finalizeWinner(); }
                }, i * 200);
            });
        }

        function finalizeWinner() {
            isSpinning = false;
            const prizeKey = document.getElementById('prize-select').value;
            const winRecord = {
                ...currentWinner,
                prize: prizeKey,
                prizeItem: PRIZES[prizeKey].item,
                timestamp: new Date().toLocaleString('vi-VN')
            };
            winners.push(winRecord);
            localStorage.setItem('livotec_winners', JSON.stringify(winners));
            showWinnerOverlay(winRecord);
            renderHistory();
            updatePrizeUI();
        }

        function showWinnerOverlay(winner) {
            playSound('win');
            document.getElementById('winner-name').innerText = winner.name;
            document.getElementById('winner-code').innerText = winner.code;
            document.getElementById('winner-prize-name').innerText = `${winner.prize}: ${winner.prizeItem}`;
            document.getElementById('winner-overlay').style.display = 'flex';
            const end = Date.now() + 5000;
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#facc15', '#008080', '#ffffff'] });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#facc15', '#008080', '#ffffff'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function closeWinner() { playSound('click'); document.getElementById('winner-overlay').style.display = 'none'; }
        function toggleHistory() { playSound('click'); const el = document.getElementById('history-overlay'); el.style.display = el.style.display === 'flex' ? 'none' : 'flex'; if (el.style.display === 'flex') renderHistory(); }

        function renderHistory() {
            const tbody = document.getElementById('history-body');
            tbody.innerHTML = winners.length ? '' : '<tr><td colspan="6" class="text-center italic text-gray-400">Chưa có ai</td></tr>';
            winners.slice().reverse().forEach((w, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${w.timestamp}</td><td>${w.prize}</td><td>${w.name}</td><td>${w.code}</td><td>${w.phone}</td><td><button onclick="removeWinner(${winners.length - 1 - index})" class="text-red-500 font-bold">X</button></td>`;
                tbody.appendChild(tr);
            });
        }

        function removeWinner(idx) { playSound('click'); if (confirm("Xóa?")) { winners.splice(idx, 1); localStorage.setItem('livotec_winners', JSON.stringify(winners)); renderHistory(); updatePrizeUI(); } }

        function exportCSV() {
            if (winners.length === 0) return;
            let csv = "\uFEFFSTT,Thời gian,Hạng giải,Tên giải,Họ và Tên,Mã dự thưởng,Số điện thoại\n";
            winners.forEach((w, i) => { csv += `${i+1},${w.timestamp},${w.prize},${w.prizeItem},${w.name},${w.code},${w.phone}\n`; });
            const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
            link.setAttribute("download", `Livotec_Winners.csv`); link.click();
        }

        window.onload = () => { createSlots(); loadPlayers(); };
        window.addEventListener('keydown', (e) => { if (e.code === 'Space' && !isSpinning && document.getElementById('winner-overlay').style.display !== 'flex') handleSpin(); });
    </script>
</body>
</html>
